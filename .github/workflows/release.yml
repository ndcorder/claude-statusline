name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*checksums.txt

  verify-reproducibility:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            goamd64: v1
          - goos: linux
            goarch: arm64
            goarm64: v8.0
          - goos: darwin
            goarch: arm64
            goarm64: v8.0
          - goos: darwin
            goarch: amd64
            goamd64: v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Rebuild from source
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          GOARM64: ${{ matrix.goarm64 }}
        run: go build -trimpath -buildvcs=false -ldflags='-s -w' -o local-build .
      - name: Download and extract release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          EXT=tar.gz
          [ "${{ matrix.goos }}" = "windows" ] && EXT=zip
          ARCHIVE="claude-statusline_${TAG#v}_${{ matrix.goos }}_${{ matrix.goarch }}.${EXT}"
          gh release download "$TAG" --pattern "$ARCHIVE"
          tar xzf "$ARCHIVE"
      - name: Verify byte-identical
        run: |
          RELEASE=$(sha256sum claude-statusline | awk '{print $1}')
          LOCAL=$(sha256sum local-build | awk '{print $1}')
          echo "Release: $RELEASE"
          echo "Local:   $LOCAL"
          if [ "$RELEASE" != "$LOCAL" ]; then
            echo "::error::Reproducibility check FAILED for ${{ matrix.goos }}/${{ matrix.goarch }}"
            exit 1
          fi
          echo "✓ Reproducible: ${{ matrix.goos }}/${{ matrix.goarch }}"
